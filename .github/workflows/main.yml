name: Build Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Permission Denied
      run: chmod +x gradlew

    - name: Build Bukkit with Lombok Setup
      run: ./gradlew :bukkit:build -Dorg.gradle.internal.http.socketTimeout=60000

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GriefDefender-Jar-File
        path: Bukkit/build/libs/*.jar
